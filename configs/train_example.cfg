[data]
name=deap
tr_lst=./data_list/deap/train_
te_lst=./data_list/deap/val_
data_folder=data/sample
output_folder=./output/deap
pt_file=none
segment_or_not=trail
emotion_state=v-a-d

[windowing]
fs=128
cw_len=30000
cw_shift=20000
channel_num=0:16

[cnn]
arch=MultiModalResNet1D
cnn_N_filt=32,64,32
cnn_len_filt=64,5,5
cnn_max_pool_len=3,3,3
cnn_use_laynorm_inp=True
cnn_use_batchnorm_inp=False
cnn_use_laynorm=True,True,True
cnn_use_batchnorm=False,False,False
cnn_act=leaky_relu,leaky_relu,leaky_relu
cnn_drop=0.0,0.0,0.0
mulhead_num_hiddens=32
mulhead_num_heads=4
mulhead_num_query=32
dropout_fc=0.2
att_hidden_dims_fc=512
hidden_dims_fc=128
num_classes=2

[optimization]
lr=0.0001
batch_size=32
N_epochs=15
N_batches=20
N_eval_epoch=1
seed=1234
fold=1
patience=10

